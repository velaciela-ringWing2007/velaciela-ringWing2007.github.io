<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>攻撃監視コンソール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
  /* 攻撃監視コンソール : 日本中心正距円筒 / 複数標的・ランダム・報復 / 標準(シアン)・攻殻MAX(レッド) */
  :root{
    --bg:#05070d;--bg-g1:#0a1322;--bg-g2:#03040a;
    --panel:rgba(10,16,26,.72);--panel-brd:rgba(90,150,190,.16);
    --grid:rgba(90,170,210,.10);--grid2:rgba(90,170,210,.22);--land:rgba(90,175,215,.32);
    --fg:#cfeaf5;--fg-dim:#6f90a2;
    --cyan:#35e0ff;--target:#ff5a4d;--good:#5ef0a8;--warn:#ffb454;--glow:rgba(53,224,255,.35);
    color-scheme:dark;
  }
  :root[data-mode="max"]{
    --bg:#0a0406;--bg-g1:#2a0a12;--bg-g2:#0a0306;
    --panel:rgba(26,10,12,.72);--panel-brd:rgba(190,100,100,.20);
    --grid:rgba(215,95,95,.10);--grid2:rgba(215,95,95,.24);--land:rgba(210,105,105,.30);
    --fg:#f5dada;--fg-dim:#b07c7c;
    --cyan:#ff5a4d;--target:#ffcf3a;--good:#5effb0;--warn:#ffb454;--glow:rgba(255,90,77,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(130% 90% at 50% -10%, var(--bg-g1) 0%, var(--bg) 58%, var(--bg-g2) 100%);
    color:var(--fg);font-family:"Share Tech Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s;}
  .wrap{min-height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:14px;max-width:1280px;margin-inline:auto;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    border:1px solid var(--panel-brd);background:var(--panel);border-radius:10px;padding:10px 16px;backdrop-filter:blur(2px);}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0}
  .brand .jp{font-family:"Rajdhani",system-ui,sans-serif;font-weight:700;font-size:clamp(18px,3.4vw,26px);letter-spacing:.06em;line-height:1;color:#fff;text-wrap:balance;}
  .brand .en{font-size:11px;letter-spacing:.34em;color:var(--fg-dim);text-transform:uppercase}
  .status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px}
  .live{display:flex;align-items:center;gap:7px;color:var(--good);letter-spacing:.18em}
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:blink 1.6s steps(1,end) infinite}
  @keyframes blink{50%{opacity:.25}}
  .clock{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:17px;letter-spacing:.1em;color:#fff;font-variant-numeric:tabular-nums}
  .status .lbl{color:var(--fg-dim);letter-spacing:.14em}
  .console{display:flex;gap:12px;align-items:stretch}
  @media(max-width:820px){.console{flex-direction:column}}
  .mapwrap{position:relative;flex:1 1 440px;min-width:0;border:1px solid var(--panel-brd);border-radius:10px;overflow:hidden;
    background:linear-gradient(180deg,#060b15,#04060d);aspect-ratio:20/11;}
  :root[data-mode="max"] .mapwrap{background:linear-gradient(180deg,#150608,#0a0306)}
  canvas{display:block;width:100%;height:100%}
  .mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.14) 2px 3px),radial-gradient(120% 120% at 50% 50%,transparent 62%,rgba(0,0,0,.55) 100%);mix-blend-mode:multiply;}
  :root[data-mode="max"] .mapwrap::after{background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(30,0,0,.22) 2px 3px),radial-gradient(120% 120% at 50% 50%,transparent 58%,rgba(20,0,0,.6) 100%);}
  .corner{position:absolute;width:16px;height:16px;border:1px solid var(--grid2);pointer-events:none;opacity:.7}
  .corner.tl{top:8px;left:8px;border-right:0;border-bottom:0}.corner.tr{top:8px;right:8px;border-left:0;border-bottom:0}
  .corner.bl{bottom:8px;left:8px;border-right:0;border-top:0}.corner.br{bottom:8px;right:8px;border-left:0;border-top:0}
  .maptag{position:absolute;top:10px;left:16px;font-size:10px;letter-spacing:.24em;color:var(--fg-dim);pointer-events:none}
  .maptag b{color:var(--target);font-weight:400}
  .side{flex:0 0 288px;display:flex;flex-direction:column;gap:12px;min-width:0}
  @media(max-width:820px){.side{flex:1 1 auto}}
  .panel{border:1px solid var(--panel-brd);background:var(--panel);border-radius:10px;padding:12px 14px;backdrop-filter:blur(2px)}
  .panel h2{margin:0 0 8px;font-family:"Rajdhani",sans-serif;font-weight:600;font-size:12px;letter-spacing:.26em;color:var(--fg-dim);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
  .panel h2 small{font-size:10px;letter-spacing:.14em;color:var(--cyan)}
  .total{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1;letter-spacing:.02em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
  .total-sub{font-size:10px;letter-spacing:.2em;color:var(--fg-dim);margin-top:5px}
  .rank{display:flex;flex-direction:column;gap:7px}
  .rank .cell{display:grid;grid-template-columns:20px 1fr auto;gap:9px 9px;align-items:center;font-size:12px}
  .rank .cc{color:var(--fg-dim);font-size:11px}.rank .name{color:var(--fg)}
  .rank .bar{grid-column:2/4;height:3px;background:rgba(120,140,160,.14);border-radius:2px;overflow:hidden}
  .rank .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--panel-brd));box-shadow:0 0 8px var(--glow)}
  .rank .cnt{color:#fff;font-variant-numeric:tabular-nums}
  .feed{display:flex;flex-direction:column;gap:3px;font-size:11px;line-height:1.5;height:168px;overflow:hidden;mask-image:linear-gradient(180deg,#000 72%,transparent)}
  .feed .l{display:flex;gap:8px;white-space:nowrap;opacity:0;animation:slideIn .35s ease forwards}
  @keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .feed .t{color:var(--fg-dim)}.feed .ip{color:var(--fg)}.feed .ar{color:var(--fg-dim)}.feed .cc{color:var(--fg-dim)}
  .feed .l.ret .ar{color:var(--good)}
  .targetbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--panel-brd);background:var(--panel);border-radius:10px;padding:9px 14px}
  .tlabel{font-size:11px;letter-spacing:.2em;color:var(--fg-dim);flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips.lock{opacity:.4;pointer-events:none}
  .chip{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.04em;
    border:1px solid var(--panel-brd);border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--fg-dim);
    background:rgba(120,160,190,.05);transition:border-color .15s,color .15s,background .15s;user-select:none}
  .chip input{position:absolute;opacity:0;width:0;height:0}
  .chip:hover{border-color:var(--cyan)}
  .chip:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
  .chip .cd{width:6px;height:6px;border-radius:50%;background:var(--fg-dim)}
  .chip.sel{color:#fff;border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 15%,transparent)}
  .chip.sel .cd{background:var(--target);box-shadow:0 0 6px var(--target)}
  .controls{display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap;border:1px solid var(--panel-brd);background:var(--panel);border-radius:10px;padding:10px 16px}
  button{font-family:inherit;color:var(--fg);background:rgba(120,160,190,.07);border:1px solid var(--panel-brd);border-radius:7px;padding:7px 14px;cursor:pointer;letter-spacing:.12em;font-size:12px;transition:background .15s,border-color .15s,color .15s}
  button:hover{background:rgba(120,160,190,.16);border-color:var(--cyan)}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  button.on{color:#fff;border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 14%,transparent)}
  .ctl{display:flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.14em;color:var(--fg-dim)}
  input[type=range]{accent-color:var(--cyan);width:110px}
  .hint{font-size:10px;letter-spacing:.1em;color:var(--fg-dim);margin-left:auto}
  .hint b{color:var(--cyan);font-weight:400}
  .ops{display:flex;gap:12px;align-items:stretch}
  @media(max-width:820px){.ops{flex-direction:column}}
  .term,.assistant{flex:1 1 320px;min-width:0;border:1px solid var(--panel-brd);background:var(--panel);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
  .ohead{font-family:"Rajdhani",sans-serif;font-weight:600;font-size:12px;letter-spacing:.24em;color:var(--fg-dim);text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--panel-brd);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ohead .k{color:var(--cyan);letter-spacing:.1em}
  .termout{flex:1;min-height:150px;max-height:230px;overflow:auto;padding:10px 14px;font-size:12px;line-height:1.55}
  .tline{white-space:pre-wrap;word-break:break-word}
  .tline.err{color:var(--warn)}.tline.ok{color:var(--good)}.tline.sys{color:var(--fg-dim)}
  .tp{color:var(--good)}
  .tinrow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--panel-brd);padding:8px 14px}
  #tin{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--fg);font-family:inherit;font-size:12px}
  .amsgs{flex:1;min-height:150px;max-height:200px;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:88%;padding:7px 11px;border-radius:10px;font-size:12px;line-height:1.5}
  .bub.ai{align-self:flex-start;background:color-mix(in srgb,var(--cyan) 12%,transparent);border:1px solid var(--panel-brd);border-bottom-left-radius:3px}
  .bub.me{align-self:flex-end;background:rgba(120,160,190,.1);border:1px solid var(--panel-brd);border-bottom-right-radius:3px;color:var(--fg)}
  .achoice{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--panel-brd);padding:10px 14px}
  .achoice button{font-size:11px;padding:6px 11px}
  @media(prefers-reduced-motion:reduce){.feed .l{animation:none;opacity:1}.live .dot{animation:none}body{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="jp">攻撃監視コンソール</span><span class="en">Realtime Threat Monitor</span></div>
    <div class="status">
      <span class="live"><span class="dot"></span>LIVE</span>
      <span><span class="lbl">TARGET </span><b id="tgtname" style="color:var(--target);font-weight:400">JAPAN / TOKYO</b></span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </header>
  <div class="console">
    <div class="mapwrap">
      <canvas id="map"></canvas>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="maptag">AMOUNT OF CYBER ATTACKS &nbsp;/&nbsp; FROM ALL &nbsp;&rarr;&nbsp; <b id="tgttag">TO JAPAN</b></span>
    </div>
    <div class="side">
      <div class="panel"><h2>Attacks Today <small id="rate">+0 /s</small></h2>
        <div class="total" id="total">0</div><div class="total-sub" id="daylbl">TODAY &middot; 日替わりリセット</div></div>
      <div class="panel"><h2>Top Sources <small id="uniq">0 CC</small></h2><div class="rank" id="rank"></div></div>
      <div class="panel"><h2>Live Feed</h2><div class="feed" id="feed"></div></div>
    </div>
  </div>
  <div class="targetbar"><span class="tlabel">TARGETS</span><div class="chips" id="chips"></div></div>
  <div class="controls">
    <button id="play" class="on">&#10074;&#10074; PAUSE</button>
    <button id="burst">&#9889; BURST</button>
    <button id="random">&#127922; RANDOM</button>
    <button id="retal" class="on">&#8635; RETALIATE</button>
    <button id="mode">MODE: 標準</button>
    <div class="ctl">SPEED <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"><span id="spd">1.0x</span></div>
    <div class="hint">データ差し替え可 &rarr; <b>window.ATTACK.push(ev)</b></div>
  </div>
  <div class="ops">
    <div class="term">
      <div class="ohead">COMMAND CONSOLE <span class="k" id="hqlbl">HQ: TOKYO</span></div>
      <div class="termout" id="term"></div>
      <div class="tinrow"><span class="tp">def@shell:~$</span><input id="tin" autocomplete="off" spellcheck="false" placeholder="help と入力して Enter"></div>
    </div>
    <div class="assistant">
      <div class="ohead">防衛支援AI <span class="k">〈ククリ〉</span></div>
      <div class="amsgs" id="amsg"></div>
      <div class="achoice" id="achoice"></div>
    </div>
  </div>
</div>

   累計は localStorage に「今日の日付＋カウント」で保存し日付変化で0リセット。標準(シアン)/攻殻MAX(レッド)。 */

  const mx=(sx+tx)/2,my=(sy+ty)/2, dx=tx-sx,dy=ty-sy, d=Math.hypot(dx,dy)||1;
  const lift=Math.min(d*0.32,H*0.42), cx=mx-dy/d*lift, cy=my-dx/d*lift-d*0.04;
  arcs.push(Object.assign({sx,sy,cx,cy,tx,ty,t:0,speed:0.55+Math.random()*0.35,done:false},o));
}
function emit(ev){
  const T=destTarget();
  total++; counts.set(ev.cc,(counts.get(ev.cc)||0)+1); rateWin.push(performance.now());
  makeArc({fromLat:ev.srcLat,fromLng:ev.srcLng,toLat:T.lat,toLng:T.lng,kind:'in',proto:ev.proto,ip:ev.ip,cc:ev.cc,fromName:ev.label,toName:T.name,port:ev.port});
  flares.set(ev.label,performance.now()+600); logLine(ev.ip,T.name,ev.proto,ev.port,ev.cc,'in');
}
window.ATTACK={push:emit, event:randomEvent};

function retaliateFrom(a){ // 防衛側 → 攻撃元 への反撃
  makeArc({fromLat:a.toLat,fromLng:a.toLng,toLat:a.fromLat,toLng:a.fromLng,kind:'out',proto:a.proto,ip:a.ip,cc:a.cc,fromName:a.toName,toName:a.fromName,port:a.port});
  logLine(a.toName,a.fromName,a.proto,a.port,a.cc,'out');
}

const feed=document.getElementById('feed');
function logLine(from,to,proto,port,cc,kind){
  const d=new Date(), ts=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  const el=document.createElement('div'); el.className='l'+(kind==='out'?' ret':'');
  const arr = kind==='out' ? `&#8635; ${String(to).toUpperCase()}` : `&rarr; ${String(to).toUpperCase()}`;
  const col = kind==='out' ? getCss('--good') : protoColor(proto);
  el.innerHTML=`<span class="t">${ts}</span><span class="ip">${from}</span><span class="ar">${arr}</span>`+
    `<span style="color:${col}">${proto}/${port}</span><span class="cc">[${cc}]</span>`;
  feed.prepend(el); while(feed.childElementCount>14) feed.lastElementChild.remove();
}

const rankEl=document.getElementById('rank'); let rankAcc=0;
function drawRank(){
  const arr=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6), max=arr.length?arr[0][1]:1;
  rankEl.innerHTML=arr.map(([cc,n],i)=>`<div class="cell"><span class="cc">${String(i+1).padStart(2,'0')}</span>`+
    `<span class="name">${CC_NAME[cc]||cc}</span><span class="cnt">${n.toLocaleString()}</span>`+
    `<span class="bar"><span style="width:${(n/max*100).toFixed(1)}%"></span></span></div>`).join('');
  document.getElementById('uniq').textContent=counts.size+' CC';
}

/* ════ 描画 ════ */
const bez=(p,a,c,b)=>{const q=1-p;return [q*q*a[0]+2*q*p*c[0]+p*p*b[0], q*q*a[1]+2*q*p*c[1]+p*p*b[1]];};
const hex2rgb=h=>{h=(h||'#35e0ff').replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
function drawCities(now){
  for(const c of CITIES){ const [x,y]=proj(c[2],c[3]); const hot=(flares.get(c[0])||0)>now;
    ctx.beginPath();ctx.arc(x,y,hot?2.4:1.3,0,7); ctx.fillStyle=hot?'#fff':'rgba(150,175,195,.5)';
    if(hot){ctx.shadowBlur=10;ctx.shadowColor='#cfe8ff';} ctx.fill();ctx.shadowBlur=0; }
}
function drawTargets(now){
  const t=(now/1000)%2/2, [r,g,b]=hex2rgb(getCss('--target'));
  if(randomMode){ // 全拠点を小さな標的マーカーで常時表示
    for(const T of TARGETS){ const [x,y]=proj(T.lat,T.lng);
      ctx.strokeStyle=`rgba(${r},${g},${b},.45)`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.stroke();
      ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fillStyle=`rgba(${r},${g},${b},.7)`;ctx.fill(); }
    return;
  }
  for(const i of active){ const [x,y]=proj(TARGETS[i].lat,TARGETS[i].lng);
    ctx.strokeStyle=`rgba(${r},${g},${b},${(1-t)*.6})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(x,y,4+t*16,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.shadowBlur=14;ctx.shadowColor=`rgb(${r},${g},${b})`;ctx.fill();ctx.shadowBlur=0; }
}
function drawArc(a){
  const col = a.kind==='out' ? getCss('--good') : protoColor(a.proto);
  const A=[a.sx,a.sy],C=[a.cx,a.cy],B=[a.tx,a.ty],[r,g,b]=hex2rgb(col);
  ctx.lineWidth=1;ctx.strokeStyle=`rgba(${r},${g},${b},0.10)`;
  ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.quadraticCurveTo(C[0],C[1],B[0],B[1]);ctx.stroke();
  const head=Math.min(a.t,1), tail=Math.max(0,head-0.22);
  ctx.lineWidth=1.8;ctx.lineCap='round';ctx.shadowBlur=8;ctx.shadowColor=col;ctx.beginPath();
  for(let i=0;i<=16;i++){ const p=tail+(head-tail)*i/16, pt=bez(p,A,C,B); i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]); }
  ctx.strokeStyle=`rgba(${r},${g},${b},0.9)`;ctx.stroke();ctx.shadowBlur=0;
  const hp=bez(head,A,C,B);ctx.beginPath();ctx.arc(hp[0],hp[1],2,0,7);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.shadowColor=col;ctx.fill();ctx.shadowBlur=0;
}
function drawRipples(now){
  for(const rp of ripples){ const k=(now-rp.born)/700; if(k>=1)continue;
    const [r,g,b]=hex2rgb(rp.kind==='out'?getCss('--good'):getCss('--target'));
    ctx.strokeStyle=`rgba(${r},${g},${b},${(1-k)*.8})`;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(rp.x,rp.y,2+k*22,0,7);ctx.stroke(); }
}

/* ════ ループ ════ */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  if(!paused){ spawnAcc+=dt*speed*7; while(spawnAcc>=1){ emit(randomEvent()); spawnAcc-=1; }
    for(const a of arcs){ a.t+=dt*a.speed;
      if(!a.done&&a.t>=1){ a.done=true; ripples.push({x:a.tx,y:a.ty,born:now,kind:a.kind});
        if(a.kind==='in'&&retaliate&&Math.random()<0.28) retaliateFrom(a); } }
    for(let i=arcs.length-1;i>=0;i--) if(arcs[i].t>1.15) arcs.splice(i,1);
    for(let i=ripples.length-1;i>=0;i--) if(now-ripples[i].born>700) ripples.splice(i,1);
  }
  ctx.clearRect(0,0,W,H); ctx.drawImage(base,0,0,W,H);
  drawCities(now); for(const a of arcs) drawArc(a); drawTargets(now); drawRipples(now);
  document.getElementById('total').textContent=total.toLocaleString();
  rankAcc+=dt; if(rankAcc>0.4){drawRank();rankAcc=0;}
  const cut=now-1000; while(rateWin.length&&rateWin[0]<cut)rateWin.shift();
  rateShown+=(rateWin.length-rateShown)*0.2; document.getElementById('rate').textContent='+'+Math.round(rateShown)+' /s';
  requestAnimationFrame(frame);
}

/* ════ 日替わりリセット / 設定保存 ════ */
const KEY='attackmap.daily', CFG='attackmap.cfg';
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let curDay=todayStr();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({date:curDay,total,counts:[...counts.entries()]})); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&s.date===todayStr()){ total=s.total||0; (s.counts||[]).forEach(([k,v])=>counts.set(k,v)); return true; } }catch(e){} return false; }
function resetDay(){ curDay=todayStr(); total=0; counts.clear(); arcs.length=0; ripples.length=0; rateWin=[]; feed.innerHTML=''; drawRank(); save(); }
const daylbl=document.getElementById('daylbl');
function tick(){ const d=new Date();
  document.getElementById('clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  if(todayStr()!==curDay) resetDay(); daylbl.textContent=curDay+' · 日替わりリセット'; save(); }
function savecfg(){ try{ localStorage.setItem(CFG,JSON.stringify({a:[...active],m:mode,r:randomMode,x:retaliate})); }catch(e){} }

/* ════ 標的 / モード ════ */
function applyLabels(){ const nm=document.getElementById('tgtname'), tg=document.getElementById('tgttag');
  if(randomMode){ nm.textContent='RANDOM / ALL'; tg.textContent='TO RANDOM'; return; }
  if(active.size===1){ const t=TARGETS[[...active][0]]; nm.textContent=t.jp; tg.textContent=t.tag; }
  else { nm.textContent='MULTI ('+active.size+')'; tg.textContent='TO '+active.size+' SITES'; } }
const chipsEl=document.getElementById('chips');
function buildChips(){ chipsEl.innerHTML=TARGETS.map((t,i)=>
  `<label class="chip${active.has(i)?' sel':''}"><input type="checkbox" data-i="${i}"${active.has(i)?' checked':''}><span class="cd"></span>${t.name}</label>`).join(''); }
function syncChips(){ [...chipsEl.querySelectorAll('.chip')].forEach(l=>{ const idx=+l.querySelector('input').dataset.i;
  l.classList.toggle('sel',active.has(idx)); l.querySelector('input').checked=active.has(idx); });
  chipsEl.classList.toggle('lock',randomMode); }
chipsEl.addEventListener('change',e=>{ const inp=e.target, i=+inp.dataset.i;
  if(active.has(i)){ if(active.size<=1){ inp.checked=true; return; } active.delete(i); } else active.add(i);
  syncChips(); recenter(); arcs.length=0; ripples.length=0; applyLabels(); updHQ(); buildBase(); savecfg(); });

const modeBtn=document.getElementById('mode');
function applyMode(){ document.documentElement.setAttribute('data-mode',mode); clearCss();
  modeBtn.textContent = mode==='max' ? 'MODE: 攻殻MAX' : 'MODE: 標準'; modeBtn.classList.toggle('on',mode==='max'); buildBase(); }

const randBtn=document.getElementById('random'), retalBtn=document.getElementById('retal');
function applyRandom(){ randBtn.classList.toggle('on',randomMode); syncChips(); recenter(); arcs.length=0; ripples.length=0; applyLabels(); updHQ(); buildBase(); }
function applyRetal(){ retalBtn.classList.toggle('on',retaliate); }

/* ════ 操作 ════ */
const playBtn=document.getElementById('play');
function setPaused(p){ paused=p; playBtn.innerHTML=p?'&#9654; PLAY':'&#10074;&#10074; PAUSE'; playBtn.classList.toggle('on',!p); }
playBtn.onclick=()=>setPaused(!paused);
document.getElementById('burst').onclick=()=>{ for(let i=0;i<40;i++) emit(randomEvent()); };
randBtn.onclick=()=>{ randomMode=!randomMode; applyRandom(); savecfg(); };
retalBtn.onclick=()=>{ retaliate=!retaliate; applyRetal(); savecfg(); };
modeBtn.onclick=()=>{ mode=mode==='max'?'std':'max'; applyMode(); savecfg(); };
const spd=document.getElementById('spd');
document.getElementById('speed').oninput=e=>{ speed=+e.target.value; spd.textContent=(speed%1?speed.toFixed(2):speed.toFixed(1))+'x'; };

/* ════ コマンドコンソール（画面内演出）════ */
const term=document.getElementById('term'), tin=document.getElementById('tin'), hqlbl=document.getElementById('hqlbl');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function techo(html,cls){ const d=document.createElement('div'); d.className='tline'+(cls?' '+cls:''); d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; }
function hqTarget(){ return randomMode?TARGETS[0]:TARGETS[[...active][0]]; }
function updHQ(){ if(hqlbl) hqlbl.textContent='HQ: '+hqTarget().name.toUpperCase(); }
function topName(){ let best=null,bn=0; for(const [cc,n] of counts){ if(n>bn){bn=n;best=cc;} } return best?(CC_NAME[best]||best):'—'; }
function findPlace(q){ if(!q)return null; q=q.toLowerCase();
  let t=TARGETS.find(x=>x.name.toLowerCase()===q)||TARGETS.find(x=>x.name.toLowerCase().startsWith(q))||TARGETS.find(x=>x.name.toLowerCase().includes(q));
  if(t)return {lat:t.lat,lng:t.lng,name:t.name};
  let c=CITIES.find(x=>x[0].toLowerCase()===q)||CITIES.find(x=>x[0].toLowerCase().includes(q));
  if(c)return {lat:c[2],lng:c[3],name:c[0]}; return null; }
function playerStrike(place,label){ const HQ=hqTarget();
  makeArc({fromLat:HQ.lat,fromLng:HQ.lng,toLat:place.lat,toLng:place.lng,kind:'player',proto:'OPS',ip:'OPS',cc:'JP',fromName:HQ.name,toName:place.name,port:label||'ops'});
  logLine(HQ.name,place.name,'OPS',label||'strike','JP','out'); }
const CMDHELP=[
 'help              — コマンド一覧',
 'ls / targets      — 標的拠点の一覧',
 'status            — 現在の統計',
 'nmap &lt;地名&gt;       — 指定地点をスキャン（HQから線を飛ばす）',
 'ping/curl/ssh/hydra/attack &lt;地名&gt; — 同上（演出）',
 'scan              — 全拠点を一斉スキャン',
 'defend            — 攻撃中の相手へ一斉反撃',
 'clear             — 画面クリア',
 '※実際にどこかを攻撃するわけではなく、画面内の演出だよ',
];
let hist=[], hix=0;
function runCmd(raw){
  techo('<span class="tp">def@shell:~$</span> '+esc(raw));
  const line=raw.trim(); if(!line)return; hist.push(line); hix=hist.length;
  const parts=line.split(/\s+/), cmd=parts[0].toLowerCase(), arg=parts.slice(1).join(' ');
  switch(cmd){
    case 'help': case '?': CMDHELP.forEach(l=>techo(l,'sys')); break;
    case 'ls': case 'targets': techo(TARGETS.map(t=>t.name).join('   '),'sys'); break;
    case 'status': techo('ATTACKS TODAY: '+total.toLocaleString()+'　/　TOP SOURCE: '+topName()+'　/　RETALIATE: '+(retaliate?'ON':'OFF'),'ok'); break;
    case 'clear': term.innerHTML=''; break;
    case 'scan': TARGETS.forEach(t=>playerStrike({lat:t.lat,lng:t.lng,name:t.name},'scan')); techo('scanning all '+TARGETS.length+' sites ...','ok'); break;
    case 'defend': case 'shield': { let n=0; [...flares.keys()].forEach(name=>{ const c=CITIES.find(x=>x[0]===name); if(c){playerStrike({lat:c[2],lng:c[3],name:c[0]},'counter');n++;} }); techo(n?('counter-strike launched @ '+n+' hostiles'):'no active hostiles','ok'); break; }
    case 'nmap': case 'ping': case 'curl': case 'ssh': case 'hydra': case 'attack': case 'strike': {
      const p=findPlace(arg); if(!p){ techo(arg?('place not found: '+esc(arg)):(cmd+': 地名を指定してね  例) '+cmd+' osaka'),'err'); break; }
      playerStrike(p,cmd); techo(cmd+' &rarr; '+esc(p.name)+' ... packet sent','ok'); break; }
    default: techo('command not found: '+esc(cmd)+'   ( help で一覧 )','err');
  }
}
tin.addEventListener('keydown',e=>{ if(e.key==='Enter'){ runCmd(tin.value); tin.value=''; }
  else if(e.key==='ArrowUp'){ if(hix>0){hix--;tin.value=hist[hix]||'';} e.preventDefault(); }
  else if(e.key==='ArrowDown'){ if(hix<hist.length-1){hix++;tin.value=hist[hix]||'';}else{hix=hist.length;tin.value='';} e.preventDefault(); } });

/* ════ 疑似LLM相談窓（人工無能・選択肢式）════ */
const amsg=document.getElementById('amsg'), achoice=document.getElementById('achoice');
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
function asay(text,who){ const d=document.createElement('div'); d.className='bub '+(who||'ai'); d.textContent=text; amsg.appendChild(d); amsg.scrollTop=amsg.scrollHeight; }
const CH=[
 {q:'現状を分析して', run:()=>`攻撃総数は${total.toLocaleString()}件。いま一番うるさいのは${topName()}方面だよ。`},
 {q:'反撃すべき？', run:()=> retaliate
    ? pickOne(['もう自動反撃モード入ってるよ、ぬかりなし！','反撃は作動中。やられたらやり返す、だね。'])
    : (retaliate=true,applyRetal(),savecfg(),'反撃モード、オンにしといたよ！どんどん撃ち返そ。') },
 {q:'どこが危ない？', run:()=> pickOne([`${topName()}からの波が濃いね、要警戒。`,'全方位から来てるけど、落ち着いて見れば捌けるよ。','今のとこ致命傷なし。囮がよく働いてる。']) },
 {q:'一斉反撃して！', run:()=>{ let n=0; [...flares.keys()].forEach(name=>{ const c=CITIES.find(x=>x[0]===name); if(c){playerStrike({lat:c[2],lng:c[3],name:c[0]},'counter');n++;} }); return n?`いっきまー…！ ${n}拠点へ反撃完了。`:'今は狙える相手がいないみたい。'; } },
 {q:'ちょっと落ち着かせて', run:()=> pickOne(['だいじょうぶ、ぜんぶ囮だよ。本丸は無傷。深呼吸しよ。','画面は派手だけど実害ゼロ。コーヒーでも飲も？','このネットワークは私が見てるから、安心して。']) },
];
function renderChoices(){ achoice.innerHTML=''; CH.forEach(c=>{ const b=document.createElement('button'); b.textContent=c.q;
  b.onclick=()=>{ asay(c.q,'me'); const r=c.run(); setTimeout(()=>asay(r,'ai'),260); }; achoice.appendChild(b); }); }

/* ════ 起動 ════ */
(function(){ try{ const c=JSON.parse(localStorage.getItem(CFG)||'null');
  if(c){ if(Array.isArray(c.a)&&c.a.length){ active.clear(); c.a.forEach(i=>{ if(i>=0&&i<TARGETS.length)active.add(i); }); }
    else if(typeof c.t==='number'&&c.t>=0&&c.t<TARGETS.length){ active.clear(); active.add(c.t); }
    if(active.size===0) active.add(0);
    if(c.m==='max')mode='max'; if(c.r)randomMode=true; if(c.x===false)retaliate=false; } }catch(e){} })();
document.documentElement.setAttribute('data-mode',mode); clearCss();
modeBtn.textContent = mode==='max'?'MODE: 攻殻MAX':'MODE: 標準'; modeBtn.classList.toggle('on',mode==='max');
randBtn.classList.toggle('on',randomMode); retalBtn.classList.toggle('on',retaliate);
buildChips(); syncChips(); recenter(); applyLabels();
resize();
const had=load(); if(!had) resetDay();
drawRank(); document.getElementById('total').textContent=total.toLocaleString(); daylbl.textContent=curDay+' · 日替わりリセット';
for(let i=0;i<10;i++){ emit(randomEvent()); arcs[arcs.length-1].t=Math.random()*0.9; }
updHQ(); techo('防衛支援端末 v1 起動。 help でコマンド一覧。','sys');
asay('防衛支援AI〈ククリ〉、起動したよ。用件をえらんでね。'); renderChoices();
tick(); setInterval(tick,1000);
if(reduce) setPaused(true);
requestAnimationFrame(frame);
</script>
