<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>いろ まぜまぜ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon.svg">
  <style>
    :root {
      --ui-bg: #1b1e26;
      --ui-panel: #232734;
      --ui-text: #f2f4f8;
      --ui-sub: #aab2c5;
      --accent: #ffd43b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
      background: var(--ui-bg);
      color: var(--ui-text);
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
    }
    body { display: flex; flex-direction: column; }

    /* ===== ヘッダー / モード切り替え ===== */
    header {
      padding: 10px 12px 6px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      letter-spacing: .04em;
    }
    .mode-tabs {
      display: flex; gap: 8px; justify-content: center;
      max-width: 520px; margin: 0 auto;
    }
    .mode-tab {
      flex: 1;
      padding: 12px 6px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: var(--ui-panel);
      color: var(--ui-sub);
      font-size: 1rem; font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, border-color .15s ease, color .15s ease;
      line-height: 1.3;
    }
    .mode-tab .emoji { font-size: 1.4rem; display: block; }
    .mode-tab:active { transform: scale(.96); }
    .mode-tab.active {
      color: var(--ui-text);
      border-color: var(--accent);
      background: #2c3243;
    }

    /* 3げんしょく / 12いろ 切り替え */
    .pal-tabs {
      display: inline-flex; gap: 4px; margin: 8px auto 0;
      padding: 4px; border-radius: 999px; background: var(--ui-panel);
    }
    .pal-tab {
      border: none; border-radius: 999px;
      padding: 6px 16px;
      font-size: .85rem; font-weight: 700;
      background: transparent; color: var(--ui-sub);
      cursor: pointer;
    }
    .pal-tab:active { transform: scale(.95); }
    .pal-tab.active { background: var(--accent); color: #332a00; }

    /* ===== ステージ ===== */
    .stage-wrap {
      flex: 1;
      position: relative;
      margin: 8px 10px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.4) inset, 0 0 0 2px rgba(255,255,255,.06);
    }
    #stage {
      position: absolute; inset: 0;
      isolation: isolate;        /* ブレンドをステージ内に閉じ込める */
      touch-action: none;
      transition: background-color .35s ease;
      cursor: default;
    }
    #stage.light { background: #000; }
    #stage.glass { background: #fff; }
    #stage.paint { background: #faf9f4; }

    #paintCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: none;
      pointer-events: none;   /* ドラッグは円（disk）で受ける */
      z-index: 0;
    }

    .hint {
      position: absolute; left: 50%; bottom: 10px;
      transform: translateX(-50%);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: .82rem; font-weight: 700;
      max-width: calc(100% - 20px);
      white-space: normal; text-align: center;
      pointer-events: none;
      z-index: 9999;
      background: rgba(0,0,0,.08); color: #2a2d36;   /* ガラス(白背景)用の既定 */
      transition: color .35s ease, background-color .35s ease;
    }
    .hint.on-light { background: rgba(255,255,255,.14); color: #fff; }  /* 光(黒背景)用 */

    /* ===== 円（光／ガラス） ===== */
    .disk {
      position: absolute;
      width: var(--size, 128px);
      height: var(--size, 128px);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      touch-action: none;
      cursor: grab;
      will-change: left, top;
    }
    .disk.dragging { cursor: grabbing; }
    .disk.light {
      mix-blend-mode: screen;
      /* 中心のグロー＋常に見えるグレーの輪郭（黒い光でも形が分かる） */
      box-shadow: 0 0 0 2px rgba(140,140,140,.9), 0 0 26px 6px currentColor;
    }
    .disk.glass {
      mix-blend-mode: multiply;
      /* ソフトな影＋常に見えるグレーの輪郭（白いガラスでも形が分かる） */
      box-shadow: 0 0 0 2px rgba(120,120,120,.75), 0 2px 10px rgba(0,0,0,.2);
    }
    .disk.paint {
      mix-blend-mode: normal;
      background: transparent !important;   /* 実際の色はキャンバスが描く */
      /* いつも見えるグレーの枠（絵の具の“ひとかたまり”の位置が分かる） */
      box-shadow: 0 0 0 2px rgba(90,90,90,.55), 0 2px 8px rgba(0,0,0,.12);
    }
    /* ガラスっぽい光沢（薬のように全体へは効かせない） */
    .disk.glass::after {
      content: "";
      position: absolute;
      top: 12%; left: 16%;
      width: 34%; height: 24%;
      border-radius: 50%;
      background: rgba(255,255,255,.35);
      filter: blur(2px);
    }

    /* ===== パレット ===== */
    .palette {
      display: flex; gap: 8px 10px; justify-content: center; flex-wrap: wrap;
      padding: 8px 10px calc(6px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto; width: 100%;
    }
    .swatch {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer;
      border: none; background: none; padding: 0;
      width: 56px;
    }
    .swatch .chip {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.25);
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
      transition: transform .08s ease;
    }
    .swatch:active .chip { transform: scale(.88); }
    .swatch .label { font-size: .72rem; color: var(--ui-sub); font-weight: 700; }

    .toolbar {
      display: flex; gap: 10px; justify-content: center;
      padding: 0 10px 6px;
    }
    .btn {
      border: none; border-radius: 12px;
      padding: 9px 16px;
      font-size: .9rem; font-weight: 700;
      background: var(--ui-panel); color: var(--ui-text);
      cursor: pointer;
    }
    .btn:active { transform: scale(.96); }
    .btn.primary { background: var(--accent); color: #332a00; }

    .tip {
      text-align: center; color: var(--ui-sub);
      font-size: .74rem; padding: 0 12px 6px; line-height: 1.5;
    }
    a.home { color: var(--ui-sub); font-size: .78rem; text-decoration: none; }
    a.home:active { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>🎨 いろ まぜまぜ</h1>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="light">
        <span class="emoji">💡</span>ひかりの いろ
      </button>
      <button class="mode-tab" data-mode="glass">
        <span class="emoji">🔷</span>いろガラス
      </button>
      <button class="mode-tab" data-mode="paint">
        <span class="emoji">🎨</span>えのぐ
      </button>
    </div>
    <div class="pal-tabs">
      <button class="pal-tab active" data-palette="primary">3げんしょく</button>
      <button class="pal-tab" data-palette="pencil">12いろ</button>
    </div>
  </header>

  <div class="stage-wrap">
    <div id="stage" class="light">
      <canvas id="paintCanvas"></canvas>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="palette" id="palette"></div>

  <div class="toolbar">
    <button class="btn" id="resetBtn">さいしょから</button>
    <button class="btn" id="clearBtn">ぜんぶ けす</button>
  </div>

  <p class="tip" id="tip"></p>
  <p class="tip"><a class="home" href="../index.html">← ツール いちらんへ</a></p>

  <script>
  (function () {
    "use strict";

    // 色鉛筆の代表的な12色（両モード共通パレット）
    const PENCILS = [
      { name: "あか",     hex: "#e60026" },
      { name: "だいだい", hex: "#f28500" },
      { name: "きいろ",   hex: "#ffe100" },
      { name: "きみどり", hex: "#a0d000" },
      { name: "みどり",   hex: "#00a040" },
      { name: "みずいろ", hex: "#35c2e8" },
      { name: "あお",     hex: "#0057b8" },
      { name: "むらさき", hex: "#7b2d8b" },
      { name: "もも",     hex: "#f6a5b8" },
      { name: "ちゃ",     hex: "#8b5a2b" },
      { name: "くろ",     hex: "#1a1a1a" },
      { name: "しろ",     hex: "#ffffff" }
    ];
    function findHex(name) {
      const c = PENCILS.find(p => p.name === name);
      return c ? c.hex : "#888888";
    }

    // ===== 絵の具（顔料）混色：RYB モデル =====
    // 8つの角の色を三重線形補間して RYB→RGB に変換する
    const RYB_CORNERS = {
      c000: [255, 255, 255], // なし＝白い紙
      c100: [238,  32,  45], // あか
      c010: [252, 226,  35], // きいろ
      c001: [ 30,  80, 195], // あお
      c110: [245, 147,  30], // あか＋きいろ＝だいだい
      c011: [ 30, 160,  70], // きいろ＋あお＝みどり
      c101: [118,  44, 140], // あか＋あお＝むらさき
      c111: [ 40,  30,  28]  // 3つ＝こげ茶（くろっぽい）
    };
    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
    function rybToRgb(r, y, b) {
      r = clamp01(r); y = clamp01(y); b = clamp01(b);
      const C = RYB_CORNERS, out = [0, 0, 0];
      const lerp = (a, bb, t) => a + (bb - a) * t;
      for (let k = 0; k < 3; k++) {
        const x00 = lerp(C.c000[k], C.c100[k], r);
        const x01 = lerp(C.c001[k], C.c101[k], r);
        const x10 = lerp(C.c010[k], C.c110[k], r);
        const x11 = lerp(C.c011[k], C.c111[k], r);
        const y0 = lerp(x00, x10, y);
        const y1 = lerp(x01, x11, y);
        out[k] = Math.round(lerp(y0, y1, b));
      }
      return out;
    }
    function rgbToHex(rgb) {
      return "#" + rgb.map(v => v.toString(16).padStart(2, "0")).join("");
    }
    // くろ は「色みのない暗さ」として別扱い（白＋黒＝灰色にするため）
    function applyShade(rgb, k) {
      const f = 1 - 0.94 * (k || 0);
      return [Math.round(rgb[0] * f), Math.round(rgb[1] * f), Math.round(rgb[2] * f)];
    }
    function paintToRgb(ryb, k) {
      return applyShade(rybToRgb(ryb[0], ryb[1], ryb[2]), k);
    }

    // 絵の具の三原色（RYB）
    const PAINT_PRIMARIES = [
      { name: "あか",   ryb: [1, 0, 0] },
      { name: "きいろ", ryb: [0, 1, 0] },
      { name: "あお",   ryb: [0, 0, 1] }
    ];
    // 絵の具の代表12色（RYB の配合で定義）
    const PAINTS = [
      { name: "あか",     ryb: [1, 0, 0] },
      { name: "だいだい", ryb: [1, 1, 0] },
      { name: "きいろ",   ryb: [0, 1, 0] },
      { name: "きみどり", ryb: [0, 1, 0.4] },
      { name: "みどり",   ryb: [0, 1, 1] },
      { name: "みずいろ", ryb: [0, 0.15, 0.55] },
      { name: "あお",     ryb: [0, 0, 1] },
      { name: "むらさき", ryb: [1, 0, 1] },
      { name: "もも",     ryb: [0.3, 0, 0.03] },
      { name: "ちゃ",     ryb: [0.85, 0.8, 0.5] },
      { name: "くろ",     ryb: [0, 0, 0], k: 1 },  // 色みなしの“暗さ”
      { name: "しろ",     ryb: [0, 0, 0] }
    ];
    // 表示用の hex を事前計算
    [...PAINT_PRIMARIES, ...PAINTS].forEach(c => { c.hex = rgbToHex(paintToRgb(c.ryb, c.k)); });

    const MODES = {
      light: {
        stageClass: "light",
        diskClass: "light",
        hintClass: "on-light",
        tip: "ひかり（光源）を かさねる と、いろが たしざん で あかるく なっていくよ（加法混色）。",
        // 3げんしょく表示：光の三原色（RGB）
        primaries: [
          { name: "あか",   hex: "#ff0000" },
          { name: "みどり", hex: "#00ff00" },
          { name: "あお",   hex: "#0000ff" }
        ],
        hintPrimary: "💡 ひかりの 三原色！ あか＋みどり＋あお で しろ になるよ",
        hintPencil:  "💡 ひかりは かさねると あかるく！ いろいろ まぜてみよう",
        pencilDefaults: ["あか", "みどり", "あお"]
      },
      glass: {
        stageClass: "glass",
        diskClass: "glass",
        hintClass: "",
        tip: "いろガラス を かさねる と、ひかりが すこしずつ すいとられて くらく なるよ（減法混色）。",
        // 3げんしょく表示：色の三原色（シアン・マゼンタ・イエロー）
        primaries: [
          { name: "みずいろ", hex: "#00ffff" },
          { name: "もも",     hex: "#ff00ff" },
          { name: "きいろ",   hex: "#ffff00" }
        ],
        hintPrimary: "🔷 色の 三原色！ みず＋もも＋きいろ で くろ に ちかづくよ",
        hintPencil:  "🔷 いろガラスは かさねると くらく！ いろいろ まぜてみよう",
        pencilDefaults: ["みずいろ", "もも", "きいろ"]
      },
      paint: {
        stageClass: "paint",
        diskClass: "paint",
        hintClass: "",
        canvas: true,
        tip: "えのぐ を まぜる と、あか＋きいろ＝だいだい のように まざるよ（絵の具の三原色＝あか・きいろ・あお）。",
        primaries: PAINT_PRIMARIES,
        hintPrimary: "🎨 えのぐの 三原色！ あか＋きいろ＝だいだい、きいろ＋あお＝みどり、あか＋あお＝むらさき",
        hintPencil:  "🎨 えのぐを まぜて いろいろ つくろう！ 3つ まぜると ちゃいろ っぽく",
        pencilDefaults: ["あか", "きいろ", "あお"]
      }
    };

    const stage   = document.getElementById("stage");
    const canvas  = document.getElementById("paintCanvas");
    const ctx     = canvas.getContext("2d", { willReadFrequently: true });
    const paletteEl = document.getElementById("palette");
    const hintEl  = document.getElementById("hint");
    const tipEl   = document.getElementById("tip");

    let currentMode = "light";
    let currentPalette = "primary";   // "primary"（三原色だけ） or "pencil"（12色）
    let zCounter = 1;

    function activeColors() {
      if (currentPalette === "primary") return MODES[currentMode].primaries;
      return currentMode === "paint" ? PAINTS : PENCILS;
    }

    function diskSize() {
      const r = stage.getBoundingClientRect();
      const s = Math.min(r.width, r.height) * 0.34;
      return Math.max(78, Math.min(140, Math.round(s)));
    }

    function clearStage() {
      stage.querySelectorAll(".disk").forEach(d => d.remove());
      scheduleRender();
    }

    // ===== 絵の具モードのキャンバス描画（RYB 平均で重なりを混色）=====
    let renderQueued = false;
    function scheduleRender() {
      if (currentMode !== "paint") return;
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => { renderQueued = false; renderPaint(); });
    }

    function renderPaint() {
      if (currentMode !== "paint") return;
      const rect = stage.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      // 計算量を抑えるため内部解像度を縮小（CSS が引き伸ばしてソフトに見せる）
      const scale = Math.min(1, 320 / Math.max(rect.width, rect.height));
      const W = Math.max(1, Math.round(rect.width * scale));
      const H = Math.max(1, Math.round(rect.height * scale));
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }

      // 円のデータ（キャンバス座標）
      const disks = [];
      stage.querySelectorAll(".disk").forEach(d => {
        if (!d._ryb) return;
        disks.push({
          x: parseFloat(d.style.left) * scale,
          y: parseFloat(d.style.top) * scale,
          r: (d.offsetWidth / 2) * scale,
          ryb: d._ryb,
          k: d._k || 0
        });
      });

      const img = ctx.createImageData(W, H);
      const data = img.data;
      const paper = [250, 249, 244]; // 白い紙
      for (let py = 0; py < H; py++) {
        for (let px = 0; px < W; px++) {
          let sr = 0, sy = 0, sb = 0, sk = 0, n = 0;
          for (let i = 0; i < disks.length; i++) {
            const d = disks[i];
            const dx = px - d.x;
            if (dx < -d.r || dx > d.r) continue;   // 横のはみ出しは早めに除外
            const dy = py - d.y;
            if (dx * dx + dy * dy <= d.r * d.r) {
              sr += d.ryb[0]; sy += d.ryb[1]; sb += d.ryb[2]; sk += d.k; n++;
            }
          }
          const idx = (py * W + px) * 4;
          let rgb;
          if (n === 0) {
            rgb = paper;
          } else {
            rgb = paintToRgb([sr / n, sy / n, sb / n], sk / n);
          }
          data[idx] = rgb[0]; data[idx + 1] = rgb[1]; data[idx + 2] = rgb[2]; data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
    }

    function spawnDisk(color, cx, cy) {
      const mode = MODES[currentMode];
      const rect = stage.getBoundingClientRect();
      const size = diskSize();
      if (cx == null) {
        cx = rect.width / 2 + (Math.random() - 0.5) * rect.width * 0.25;
        cy = rect.height / 2 + (Math.random() - 0.5) * rect.height * 0.25;
      }
      const disk = document.createElement("div");
      disk.className = "disk " + mode.diskClass;
      disk.style.setProperty("--size", size + "px");
      disk._ryb = color.ryb || null;
      disk._k = color.k || 0;
      if (mode.canvas) {
        // 絵の具モード：実際の色はキャンバスが描くので円は透明（枠だけ）
        disk.style.background = "transparent";
      } else {
        disk.style.background = color.hex;
        disk.style.color = color.hex; // box-shadow の currentColor 用（光のグロー）
      }
      disk.style.left = cx + "px";
      disk.style.top = cy + "px";
      disk.style.zIndex = ++zCounter;
      stage.appendChild(disk);
      makeDraggable(disk);
      scheduleRender();
      return disk;
    }

    function makeDraggable(disk) {
      let offsetX = 0, offsetY = 0;
      let lastTap = 0;

      disk.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        // ダブルタップ / ダブルクリックで消す
        const now = Date.now();
        if (now - lastTap < 300) {
          disk.remove();
          scheduleRender();
          return;
        }
        lastTap = now;

        disk.setPointerCapture(e.pointerId);
        disk.classList.add("dragging");
        disk.style.zIndex = ++zCounter;
        const rect = stage.getBoundingClientRect();
        offsetX = (e.clientX - rect.left) - parseFloat(disk.style.left);
        offsetY = (e.clientY - rect.top) - parseFloat(disk.style.top);
      });

      disk.addEventListener("pointermove", (e) => {
        if (!disk.classList.contains("dragging")) return;
        const rect = stage.getBoundingClientRect();
        let x = (e.clientX - rect.left) - offsetX;
        let y = (e.clientY - rect.top) - offsetY;
        const half = disk.offsetWidth / 2;
        x = Math.max(half * 0.2, Math.min(rect.width - half * 0.2, x));
        y = Math.max(half * 0.2, Math.min(rect.height - half * 0.2, y));
        disk.style.left = x + "px";
        disk.style.top = y + "px";
        scheduleRender();
      });

      function endDrag(e) {
        disk.classList.remove("dragging");
        try { disk.releasePointerCapture(e.pointerId); } catch (_) {}
      }
      disk.addEventListener("pointerup", endDrag);
      disk.addEventListener("pointercancel", endDrag);
    }

    function buildPalette() {
      paletteEl.innerHTML = "";
      activeColors().forEach(c => {
        const btn = document.createElement("button");
        btn.className = "swatch";
        btn.innerHTML =
          '<span class="chip" style="background:' + c.hex + '"></span>' +
          '<span class="label">' + c.name + '</span>';
        btn.addEventListener("click", () => spawnDisk(c));
        paletteEl.appendChild(btn);
      });
    }

    function placeDefaults() {
      const mode = MODES[currentMode];
      const rect = stage.getBoundingClientRect();
      const cx = rect.width / 2, cy = rect.height / 2;
      const r = Math.min(rect.width, rect.height) * 0.18;
      // 正三角形っぽく少しだけ重なる配置
      const angles = [-90, 30, 150];
      // 三原色モードは3原色を、12色モードは代表3色を並べる
      const all = activeColors();
      const list = currentPalette === "primary"
        ? all
        : mode.pencilDefaults.map(n => all.find(c => c.name === n));
      list.forEach((color, i) => {
        const a = angles[i % 3] * Math.PI / 180;
        spawnDisk(color, cx + r * Math.cos(a), cy + r * Math.sin(a));
      });
    }

    function applyMode(reset) {
      const mode = MODES[currentMode];
      stage.className = mode.stageClass;
      canvas.style.display = mode.canvas ? "block" : "none";
      hintEl.textContent = currentPalette === "primary" ? mode.hintPrimary : mode.hintPencil;
      hintEl.className = "hint " + mode.hintClass;
      tipEl.textContent = mode.tip;
      document.querySelectorAll(".mode-tab").forEach(t => {
        t.classList.toggle("active", t.dataset.mode === currentMode);
      });
      document.querySelectorAll(".pal-tab").forEach(t => {
        t.classList.toggle("active", t.dataset.palette === currentPalette);
      });
      buildPalette();
      if (reset) { clearStage(); placeDefaults(); }
    }

    // ===== イベント =====
    document.querySelectorAll(".mode-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        if (currentMode === tab.dataset.mode) return;
        currentMode = tab.dataset.mode;
        applyMode(true);
      });
    });
    document.querySelectorAll(".pal-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        if (currentPalette === tab.dataset.palette) return;
        currentPalette = tab.dataset.palette;
        applyMode(true);
      });
    });
    document.getElementById("clearBtn").addEventListener("click", clearStage);
    document.getElementById("resetBtn").addEventListener("click", () => applyMode(true));

    // ステージのサイズが決まってから初期配置
    window.addEventListener("load", () => applyMode(true));
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        // 既存の円の大きさだけ更新（位置はそのまま）
        const size = diskSize();
        stage.querySelectorAll(".disk").forEach(d => d.style.setProperty("--size", size + "px"));
        scheduleRender();
      }, 200);
    });

    // 念のため load 前にも一度
    applyMode(true);
  })();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js").catch(() => {});
  }
  </script>
</body>
</html>
