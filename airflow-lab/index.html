<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>くうきの ながれ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/icon.svg">
  <style>
    :root { --ui-bg:#101521; --ui-panel:#1d2436; --ui-text:#eef2fa; --ui-sub:#9fa9c0; --accent:#ffd43b; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; padding:0; height:100%;
      font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
      background:var(--ui-bg); color:var(--ui-text); overscroll-behavior:none;
      -webkit-user-select:none; user-select:none; }
    body { display:flex; flex-direction:column; }
    header { padding:10px 12px 4px; text-align:center; }
    h1 { margin:0 0 8px; font-size:1.2rem; letter-spacing:.04em; }
    .mode-tabs { display:flex; gap:8px; justify-content:center; max-width:520px; margin:0 auto; }
    .mode-tab { flex:1; padding:10px 6px; border:2px solid transparent; border-radius:16px;
      background:var(--ui-panel); color:var(--ui-sub); font-size:1rem; font-weight:700; cursor:pointer; line-height:1.3;
      transition:transform .08s ease, border-color .15s ease, color .15s ease; }
    .mode-tab .emoji { font-size:1.35rem; display:block; }
    .mode-tab:active { transform:scale(.96); }
    .mode-tab.active { color:var(--ui-text); border-color:var(--accent); background:#273049; }
    .stage-wrap { flex:1; position:relative; margin:8px 10px; border-radius:18px; overflow:hidden;
      box-shadow:0 0 0 2px rgba(255,255,255,.06); touch-action:none; }
    #stage { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
    .hint { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); padding:7px 14px;
      border-radius:999px; max-width:calc(100% - 20px); font-size:.82rem; font-weight:700; text-align:center;
      background:rgba(0,0,0,.45); color:#fff; pointer-events:none; backdrop-filter:blur(2px); }
    .toolbar { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:8px 10px calc(4px + env(safe-area-inset-bottom)); }
    .btn { border:none; border-radius:12px; padding:9px 16px; font-size:.9rem; font-weight:700;
      background:var(--ui-panel); color:var(--ui-text); cursor:pointer; }
    .btn:active { transform:scale(.96); }
    .btn.on { background:var(--accent); color:#332a00; }
    .tip { text-align:center; color:var(--ui-sub); font-size:.74rem; padding:0 12px 6px; line-height:1.5; }
    a.home { color:var(--ui-sub); font-size:.78rem; text-decoration:none; }
    a.home:active { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>💨 くうきの ながれ</h1>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="blower"><span class="emoji">🎈</span>ふうせん</button>
      <button class="mode-tab" data-mode="wing"><span class="emoji">✈️</span>つばさ</button>
    </div>
  </header>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="hint" id="hint"></div>
  </div>

  <div class="toolbar">
    <button class="btn" id="flowBtn">つぶつぶ</button>
    <button class="btn" id="pressureBtn">あつりょくを みる</button>
    <button class="btn" id="forceBtn">ちからを みる</button>
    <button class="btn" id="resetBtn">さいしょから</button>
  </div>
  <p class="tip" id="tip"></p>
  <p class="tip"><a class="home" href="../index.html">← ツール いちらんへ</a></p>

  <script>
  (function () {
    "use strict";
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const hintEl = document.getElementById("hint");
    const tipEl = document.getElementById("tip");
    const forceBtn = document.getElementById("forceBtn");
    const pressureBtn = document.getElementById("pressureBtn");
    const flowBtn = document.getElementById("flowBtn");

    let W = 0, H = 0, DPR = 1;
    let currentMode = "blower";
    let showForces = false;
    let showPressure = false;
    let flowStyle = "stream";   // "stream"=ながれせん / "dots"=つぶつぶ
    let TIME = 0;

    // ---- ベクトル ----
    const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y}), add=(a,b)=>({x:a.x+b.x,y:a.y+b.y});
    const mul=(a,s)=>({x:a.x*s,y:a.y*s}), len=a=>Math.hypot(a.x,a.y);
    const norm=a=>{const l=len(a)||1;return{x:a.x/l,y:a.y/l};};
    const dot=(a,b)=>a.x*b.x+a.y*b.y, perp=a=>({x:-a.y,y:a.x});
    const clamp=(v,a,b)=>v<a?a:v>b?b:v;
    const lerp=(a,b,t)=>a+(b-a)*t;
    // 速さ→色（おそい 青 → 水 → 緑 → 黄 → はやい 赤）
    const SPEED_STOPS = [[40,110,255],[0,200,235],[90,220,90],[250,215,40],[255,70,40]];
    function speedColor(sp, smax){
      const t = clamp(sp/smax,0,1);
      const x = t*(SPEED_STOPS.length-1), i = Math.min(SPEED_STOPS.length-2, Math.floor(x)), f = x-i;
      const a=SPEED_STOPS[i], b=SPEED_STOPS[i+1];
      return "rgb("+Math.round(a[0]+(b[0]-a[0])*f)+","+Math.round(a[1]+(b[1]-a[1])*f)+","+Math.round(a[2]+(b[2]-a[2])*f)+")";
    }
    // 速さで区間ごとに色を変えて折れ線を描く（色は8段階にまとめて軽量化）
    function drawSpeedPolyline(getPt, n, smax, lw){
      if (n<2) return;
      const B=8, buckets=[];
      for (let k=0;k<B;k++) buckets.push([]);
      for (let i=1;i<n;i++){
        const a=getPt(i-1), b=getPt(i);
        const sp=(a.sp+b.sp)*0.5;
        const bi=Math.min(B-1, Math.max(0, Math.floor(clamp(sp/smax,0,1)*B)));
        buckets[bi].push(a,b);
      }
      ctx.lineWidth=lw; ctx.lineCap="round"; ctx.globalAlpha=0.9;
      for (let bi=0;bi<B;bi++){
        const segs=buckets[bi]; if (!segs.length) continue;
        ctx.strokeStyle=speedColor((bi+0.5)/B*smax, smax);
        ctx.beginPath();
        for (let k=0;k<segs.length;k+=2){ ctx.moveTo(segs[k].x,segs[k].y); ctx.lineTo(segs[k+1].x,segs[k+1].y); }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
    // 凡例（色バー）
    function drawLegend(){
      const w=104, h=10, x=W-w-16, y=14;
      for (let i=0;i<w;i++){ ctx.fillStyle=speedColor(i/w,1); ctx.fillRect(x+i,y,1,h); }
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w,h);
      ctx.fillStyle="rgba(255,255,255,.85)"; ctx.font="bold 11px sans-serif";
      ctx.textAlign="left"; ctx.fillText("おそい", x, y+h+12);
      ctx.textAlign="right"; ctx.fillText("はやい", x+w, y+h+12);
    }
    // 渦（うず）による速度。vortices: [{x,y,G,core}]
    function vortexVel(pt, vortices){
      let vx=0, vy=0;
      for (let i=0;i<vortices.length;i++){
        const v=vortices[i]; const dx=pt.x-v.x, dy=pt.y-v.y;
        const r2=dx*dx+dy*dy+v.core; const f=v.G/r2;
        vx += -dy*f; vy += dx*f;
      }
      return { x:vx, y:vy };
    }

    // つぶつぶ（流れる粒）の軌跡を描く
    function drawTrails(parts, colorMax) {
      if (!parts) return;
      ctx.lineCap="round";
      for (const p of parts){
        if (p.trail.length<2) continue;
        ctx.strokeStyle = speedColor(p.sp||colorMax*0.35, colorMax);
        ctx.globalAlpha = 0.85; ctx.lineWidth = 2.3;
        ctx.beginPath(); ctx.moveTo(p.trail[0].x, p.trail[0].y);
        for (let i=1;i<p.trail.length;i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
        ctx.stroke();
        const h=p.trail[p.trail.length-1];
        ctx.globalAlpha=0.95; ctx.fillStyle="#eaf4ff";
        ctx.beginPath(); ctx.arc(h.x,h.y,2,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }

    // 流線のギザギザを ならす（端点は固定・速度spは保持）
    function smoothPts(pts, passes){
      if (!pts || pts.length<3) return pts;
      for (let s=0;s<passes;s++){
        let px={x:pts[0].x,y:pts[0].y};
        for (let i=1;i<pts.length-1;i++){
          const nx=(px.x + 2*pts[i].x + pts[i+1].x)/4, ny=(px.y + 2*pts[i].y + pts[i+1].y)/4;
          px={x:pts[i].x,y:pts[i].y}; pts[i].x=nx; pts[i].y=ny;
        }
      }
      return pts;
    }
    // 流線（ストリームライン）を1本トレース。各点に局所速度 sp を持たせる
    function streamline(fieldFn, seed, step, maxSteps){
      const pts=[]; let p={x:seed.x,y:seed.y};
      for (let i=0;i<maxSteps;i++){
        const v=fieldFn(p); const sp=Math.hypot(v.x,v.y);
        pts.push({x:p.x,y:p.y,sp});
        if (sp<1e-3) break;
        p={x:p.x+v.x/sp*step, y:p.y+v.y/sp*step};
        if (p.x<-24||p.x>W+24||p.y<-24||p.y>H+24) break;
      }
      return pts;
    }

    // いわゆる翼型（NACA2412・キャンバー付き）の輪郭を単位コードで生成
    const AIRFOIL = (function(){
      const m=0.04, p=0.4, t=0.12, N=28, up=[], lo=[];
      for (let i=0;i<=N;i++){
        const beta=Math.PI*i/N, x=(1-Math.cos(beta))/2;
        const yt=5*t*(0.2969*Math.sqrt(x)-0.1260*x-0.3516*x*x+0.2843*x*x*x-0.1036*x*x*x*x);
        let yc, dyc;
        if (x<p){ yc=m/(p*p)*(2*p*x-x*x); dyc=2*m/(p*p)*(p-x); }
        else { yc=m/((1-p)*(1-p))*((1-2*p)+2*p*x-x*x); dyc=2*m/((1-p)*(1-p))*(p-x); }
        const th=Math.atan(dyc);
        up.push({x:x - yt*Math.sin(th), y:yc + yt*Math.cos(th)});
        lo.push({x:x + yt*Math.sin(th), y:yc - yt*Math.cos(th)});
      }
      return up.concat(lo.reverse()).map(q=>({x:q.x-0.5, y:q.y})); // 中央寄せ
    })();

    // =====================================================================
    // 🎈 送風機で風船（ジェット気流＋ベルヌーイで中心へ戻る）
    // =====================================================================
    const BL = {
      // --- 物理定数（Nodeで調整済み）---
      U0: 11, W0: 48, SPREAD: 0.13, CD: 0.0034, CC: 0.0075,
      G: 0.10, M: 1, DAMP: 0.95, BALLR: 34, SUB: 3,
      fan: null, jetAng: 0, ball: null, vel: {x:0,y:0}, floorY: 0, lines: [], vortices: [], parts: [],
      make() {
        this.fan = { x: 0.5*W, y: 0.92*H };
        this.floorY = 0.955*H;
        this.jetAng = 0;
        this.ball = { x: 0.5*W, y: 0.42*H };
        this.vel = { x:0, y:0 };
        this.parts = [];
        this.retrace();
      },
      jvec() { return { x: Math.sin(this.jetAng), y: -Math.cos(this.jetAng) }; },
      speedAt(s, a) {
        if (s < 0) return 0;
        const hw = this.W0 + this.SPREAD*s;
        const axis = this.U0 * this.W0 / (this.W0 + this.SPREAD*s);
        return axis * Math.exp(-(a*a)/(hw*hw));
      },
      field(pt) {   // 純ジェット（風船の運動計算用）
        const J = this.jvec(), K = perp(J);
        const rel = sub(pt, this.fan);
        const s = dot(rel, J), a = dot(rel, K);
        const sp = this.speedAt(s, a);
        const hw = this.W0 + this.SPREAD*s;
        const outward = (hw>0 ? a/hw : 0) * 0.12;   // 広がりを抑えて 物の まわりに 流れを 集める
        const dir = norm(add(J, mul(K, outward)));
        return { x: dir.x*sp, y: dir.y*sp, speed: sp };
      },
      updateVortices() {   // 物体の上に左右2つ（巻き込み＝ウェイク）
        const b=this.ball, r=this.BALLR, J=this.jvec(), K=perp(J);
        const up = mul(J, r*1.3), side = mul(K, r*0.95);
        const Gv = this.U0 * r * 0.95;
        const core = (r*0.8)*(r*0.8);
        this.vortices = [
          { x: b.x + up.x - side.x, y: b.y + up.y - side.y, G: +Gv, core },
          { x: b.x + up.x + side.x, y: b.y + up.y + side.y, G: -Gv, core }
        ];
      },
      visFlow(pt) {   // 見た目の流れ：ジェット＋渦＋物体まわりの回り込み
        const j = this.field(pt);
        const vo = vortexVel(pt, this.vortices);
        let v = { x: j.x+vo.x, y: j.y+vo.y };
        const d = sub(pt, this.ball), dist = len(d);
        const infl = this.BALLR*1.5;               // 物体の近くだけ 回り込ませる（密着）
        if (dist < infl && dist > 0.5) {
          const n = mul(d, 1/dist);
          const vn = dot(v, n);
          if (vn < 0) v = sub(v, mul(n, vn));      // 中へ入らず回り込む
          v = mul(v, 1 + 0.45*(1 - dist/infl));    // 横で加速
        }
        return v;
      },
      retrace() {   // 止まった流線を引き直す（物を動かすと形が変わる）
        this.updateVortices();
        this.lines = [];
        const J = this.jvec(), K = perp(J), n = 24;
        for (let i=0;i<n;i++){
          const u = (i/(n-1)*2-1);
          const a = Math.sign(u)*Math.pow(Math.abs(u),1.3) * this.W0 * 1.1;   // 中心ほど 密に
          const seed = add(this.fan, mul(K, a));
          const pts = streamline(p=>this.visFlow(p), seed, 7, 130);
          let avg=0; for (const q of pts) avg+=q.sp; avg/=(pts.length||1);
          this.lines.push({ pts, avg });
        }
      },
      // つぶつぶ（流れる粒）
      seedP() {
        const J=this.jvec(), K=perp(J);
        const u=Math.random()*2-1; const a=Math.sign(u)*Math.pow(Math.abs(u),1.6)*this.W0*1.1;
        const p=add(this.fan, mul(K, a));
        return { x:p.x, y:p.y, trail:[], life:Math.random()*40, sp:0 };
      },
      stepParts() {
        this.updateVortices();
        if (!this.parts || this.parts.length===0){ this.parts=[]; for(let i=0;i<240;i++) this.parts.push(this.seedP()); }
        for (let i=0;i<this.parts.length;i++){
          const pt=this.parts[i];
          const v=this.visFlow(pt); const sp=len(v); pt.sp=sp;
          const d=sub(pt,this.ball), dist=len(d);
          if (dist<this.BALLR*1.02 && dist>0.1){ const n=mul(d,1/dist); pt.x=this.ball.x+n.x*this.BALLR*1.02; pt.y=this.ball.y+n.y*this.BALLR*1.02; }
          pt.x+=v.x*0.8; pt.y+=v.y*0.8; pt.life++;
          pt.trail.push({x:pt.x,y:pt.y}); if(pt.trail.length>6) pt.trail.shift();
          if (pt.y<-6||pt.x<-6||pt.x>W+6||pt.life>170||(sp<0.05&&pt.life>20)) this.parts[i]=this.seedP();
        }
      },
      forces(pos, vel) {
        const J = this.jvec(), K = perp(J);
        const air = this.field(pos);
        const vrel = sub(air, vel);
        const Fd = mul(vrel, this.CD*len(vrel));              // 空気の押し上げ（抗力）
        const rel = sub(pos, this.fan);
        const s = dot(rel, J), a = dot(rel, K);
        const vP = this.speedAt(s, a + this.BALLR);
        const vM = this.speedAt(s, a - this.BALLR);
        const Fc = mul(K, this.CC*(vP*vP - vM*vM));           // ベルヌーイ：速い側へ（＝中心へ）
        const Fg = { x:0, y:this.G*this.M };                  // 重力
        return { total: add(add(Fd,Fc),Fg), Fd, Fc, Fg, air };
      },
      update(dragging) {
        if (!dragging) {
          const dt = 1/this.SUB;
          for (let k=0;k<this.SUB;k++){
            const f = this.forces(this.ball, this.vel);
            this.vel = mul(add(this.vel, mul(f.total, dt/this.M)), Math.pow(this.DAMP, dt));
            this.ball = add(this.ball, mul(this.vel, dt));
          }
          this.ball.x = clamp(this.ball.x, this.BALLR, W-this.BALLR);
          if (this.ball.y > this.floorY - this.BALLR) { this.ball.y = this.floorY-this.BALLR; if(this.vel.y>0) this.vel.y*=-0.25; this.vel.x*=0.7; }
          if (this.ball.y < this.BALLR) { this.ball.y = this.BALLR; if(this.vel.y<0) this.vel.y=0; }
        } else { this.vel = {x:0,y:0}; }
      },
      draw() {
        const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0d1324"); g.addColorStop(1,"#141b2e");
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#232b40"; ctx.fillRect(0,this.floorY,W,H-this.floorY);
        // 空気の流れ（ながれせん or つぶつぶ）。速さで色が変わる
        if (flowStyle==="stream"){
          for (const line of this.lines){
            const pts=line.pts; if (pts.length<2) continue;
            drawSpeedPolyline(i=>pts[i], pts.length, this.U0*1.1, 2);
          }
        } else {
          drawTrails(this.parts, this.U0*1.1);
        }
        this.drawFan();
        if (showPressure) this.drawPressure();   // 全方位の 正圧(+)／負圧(−)
        // 物体
        const b = this.ball, r=this.BALLR;
        const bg = ctx.createRadialGradient(b.x-r*0.3,b.y-r*0.35,r*0.2,b.x,b.y,r);
        bg.addColorStop(0,"#ff9a76"); bg.addColorStop(1,"#e23b5a");
        ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="rgba(255,255,255,.5)"; ctx.beginPath(); ctx.arc(b.x-r*0.32,b.y-r*0.36,r*0.22,0,Math.PI*2); ctx.fill();
        if (showForces) this.drawForces();
      },
      drawPressure() {   // 物体まわりの圧力（円柱近似×その場のジェット強さ）
        const b=this.ball, r=this.BALLR, J=this.jvec();
        const incFrom = mul(J,-1);   // 流れが当たる向き＝よどみ点（下）
        const N=22;
        for (let i=0;i<N;i++){
          const ang = (i/N)*Math.PI*2;
          const nrm = { x:Math.cos(ang), y:Math.sin(ang) };
          const theta = Math.acos(clamp(dot(nrm, incFrom),-1,1));
          const surf = add(b, mul(nrm, r+8));
          const localU = len(this.field(surf));
          let cp = (theta < 2.094) ? (1 - 4*Math.sin(theta)*Math.sin(theta)) : -0.5;
          cp *= clamp(localU/(this.U0*0.5), 0.12, 1.5);
          const mag = clamp(Math.abs(cp)*12, 3, 26);
          const pos = cp >= 0;          // +圧=押す(赤・内向き) / −圧=吸う(青・外向き)
          const dir = pos ? -1 : 1;
          const base = add(b, mul(nrm, r+4));
          const tip = add(base, mul(nrm, dir*mag));
          ctx.strokeStyle = pos ? "rgba(255,110,90,.95)" : "rgba(110,185,255,.95)";
          ctx.lineWidth = 2.6; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(base.x,base.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
        }
      },
      drawFan() {
        const J=this.jvec(), K=perp(J), f=this.fan;
        const w=this.W0*1.15;
        const a1=add(f,mul(K,-w)), a2=add(f,mul(K,w));
        const back=add(f,mul(J,-26));
        ctx.fillStyle="#48506b";
        ctx.beginPath();
        ctx.moveTo(a1.x,a1.y); ctx.lineTo(a2.x,a2.y);
        ctx.lineTo(back.x+K.x*w*0.7,back.y+K.y*w*0.7);
        ctx.lineTo(back.x-K.x*w*0.7,back.y-K.y*w*0.7);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle="#2e3550"; ctx.beginPath(); ctx.arc(f.x,f.y,10,0,Math.PI*2); ctx.fill();
        const hp = add(f, mul(J, 54));
        ctx.strokeStyle="rgba(255,255,255,.3)"; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(f.x,f.y); ctx.lineTo(hp.x,hp.y); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(hp.x,hp.y,9,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.14)"; ctx.fill(); ctx.strokeStyle="#9fe0ff"; ctx.lineWidth=2.5; ctx.stroke();
      },
      tiltHandlePos(){ return add(this.fan, mul(this.jvec(), 54)); },
      drawForces() {
        const f = this.forces(this.ball, {x:0,y:0});
        const b = this.ball;
        arrow(b, add(b, mul(f.Fg, 90)), "#ff5d5d", "じゅうりょく");
        arrow(b, add(b, mul(f.Fd, 90)), "#6fe3ff", "おしあげ");
        if (len(f.Fc) > 0.01) arrow(b, add(b, mul(f.Fc, 120)), "#ffe14d", "まんなかへ");
      }
    };

    // =====================================================================
    // ✈️ 翼まわりの流れ（翼の実形状に沿わせる方式）
    //   ・一様な水平風を、翼ポリゴンの表面に「沿う」よう近くだけ曲げる
    //   ・下面は ほぼ直線／上面は 翼なりに曲がり＆加速、後方で 剥離
    // =====================================================================
    const WG = {
      UINF: 2.4, R: 62, CAMBER: 0.10, alpha: 0.18, center: null, lines: [], parts: [], poly: [], shed: [], spawnT: 0,
      make() {
        this.R = clamp(Math.min(W, H)*0.085, 54, 118);   // 画面サイズに合わせて翼を大きく（4Kでも見やすく）
        this.center = { x: 0.44*W, y: 0.5*H };
        this.alpha = 0.18;
        const ch=this.chord(), ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        this.pivot = { x:this.center.x - 0.5*ch*ca, y:this.center.y - 0.5*ch*sa }; // 前縁を回転の支点に固定
        this.parts = []; this.shed = []; this.spawnT = 0; this.wakeLines = [];
        this.retrace();
      },
      chord(){ return this.R*1.9; },
      sucUp(){ return (Math.sin(this.alpha)+this.CAMBER) >= 0; }, // 吸い込み（剥離）面が上面か
      // 有効循環（＝揚力）: 失速角までは増え、超えるとガクッと落ちる（ストールドロップ）
      cl(){ const deg=Math.abs(this.alpha*180/Math.PI); const base=Math.sin(this.alpha)+this.CAMBER;
        const stall=clamp((deg-13)/5, 0, 1); return base*(1-0.7*stall); },
      gamma(){ return this.UINF * this.R * this.cl(); }, // 揚力矢印の目安
      buildPoly() {
        if (this.pivot){ const ch0=this.chord(), c0=Math.cos(this.alpha), s0=Math.sin(this.alpha);
          this.center={ x:this.pivot.x + 0.5*ch0*c0, y:this.pivot.y + 0.5*ch0*s0 }; } // 前縁支点から中心を再計算
        const c=this.center, ch=this.chord(), ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        this.poly = AIRFOIL.map(q=>{ const X=q.x*ch, Y=-q.y*ch; return { x:c.x + X*ca - Y*sa, y:c.y + X*sa + Y*ca }; });
        // 各エッジを上面／下面にタグづけ（中点のchordYで判定）→ 近くを見るとき同じ側だけ見る
        this.edgeUp = []; const P=this.poly, n=P.length;
        for (let i=0;i<n;i++){ const a=P[i], b=P[(i+1)%n]; this.edgeUp.push(this.chordY({x:(a.x+b.x)/2,y:(a.y+b.y)/2})<0); }
      },
      chordY(pt){ const dx=pt.x-this.center.x, dy=pt.y-this.center.y; return -dx*Math.sin(this.alpha)+dy*Math.cos(this.alpha); }, // <0 上面側
      pointInPoly(p){
        const poly=this.poly; let inside=false;
        for (let i=0,j=poly.length-1;i<poly.length;j=i++){
          const a=poly[i], b=poly[j];
          if (((a.y>p.y)!==(b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/((b.y-a.y)||1e-9)+a.x)) inside=!inside;
        }
        return inside;
      },
      nearest(p, side){   // 翼輪郭への最近点・外向き法線・距離・内外。side='up'/'lo'で その面だけ見る
        const poly=this.poly, eu=this.edgeUp; let best=1e18, qx=0, qy=0;
        for (let i=0;i<poly.length;i++){
          if (side==="up" && !eu[i]) continue;
          if (side==="lo" && eu[i]) continue;
          const a=poly[i], b=poly[(i+1)%poly.length];
          const abx=b.x-a.x, aby=b.y-a.y; const d2=abx*abx+aby*aby||1;
          let t=((p.x-a.x)*abx+(p.y-a.y)*aby)/d2; t=t<0?0:t>1?1:t;
          const cx=a.x+abx*t, cy=a.y+aby*t; const dx=p.x-cx, dy=p.y-cy; const dd=dx*dx+dy*dy;
          if (dd<best){ best=dd; qx=cx; qy=cy; }
        }
        const dist=Math.sqrt(best); let nx=(p.x-qx)/(dist||1), ny=(p.y-qy)/(dist||1);
        const inside=this.pointInPoly(p); if (inside){ nx=-nx; ny=-ny; }
        return { dist, nx, ny, inside };
      },
      // ダウンウォッシュ：翼の前で空気が少し上がり（アップウォッシュ）、後ろで下へ押される（＝揚力の反作用）
      downwash(pt) {
        const U=this.UINF, ch=this.chord();
        const g=this.cl();                                     // 失速で落ちる有効循環
        const dx=pt.x-this.center.x, dy=pt.y-this.center.y;
        const ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        const wx=dx*ca+dy*sa, wy=-dx*sa+dy*ca;                 // 翼座標（wx:下流, wy<0:上面側）
        const L=0.7*ch, reach=this.R*1.7;
        const s=(wx/L)*Math.exp(-0.5*(wx/L)*(wx/L));           // 前(<0)=上向き / 後(>0)=下向き
        const yf=Math.exp(-(wy*wy)/(reach*reach));
        const sepCut=1-0.95*this.sepFactor(pt);                // 剥離域は押し下げない（揚力喪失）
        const fwd = wx < -0.3*ch ? clamp(1 + (wx+0.3*ch)/(0.9*this.R), 0.3, 1) : 1; // 前方は アップウォッシュ控えめ＝真っ直ぐ寄せる
        return g*U*1.6*s*yf*sepCut*fwd;                        // 画面+y=下向き
      },
      field(pt) {
        const U=this.UINF, ch=this.chord(); const naF=this.nearest(pt);
        if (naF.inside) return { x:U*0.4 + naF.nx*U*0.6, y:naF.ny*U*0.6 };  // 中なら外へ
        const dx=pt.x-this.center.x, dy=pt.y-this.center.y;
        const ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        const wx=dx*ca+dy*sa, wy=-dx*sa+dy*ca;          // 翼座標（wx:下流, wy<0:上面）
        const upper = wy < 0;
        const na = this.nearest(pt, upper?"up":"lo");   // 上の点は上面だけ・下の点は下面だけ
        const sep = this.sepFactor(pt);                 // 剥離度（吸い込み面・分離点より後ろで>0）
        let vx=U, vy=0;
        const band=this.R*0.95;
        // 前縁より前では 分岐を弱める → よどみ点が前縁の先端に来る（手前でカクッと割れない）
        const aheadFade = clamp(1 + (wx + 0.5*ch)/(0.5*this.R), 0, 1);
        if (na.dist<band){
          const w0=1 - na.dist/band, w=w0*w0*(3-2*w0);   // smoothstep
          const follow=w*(1-sep)*aheadFade;              // 剥離域は 翼面に沿わせない（＝浮く）
          // 表面にそう接線（下流むき）
          let tx=-na.ny, ty=na.nx; if (tx<0){ tx=-tx; ty=-ty; }
          // 後縁に近づくほど 接線を翼弦方向へ寄せる（上下が後縁で滑らかに合流＝クッタ条件風）
          const teB=clamp((wx - 0.25*ch)/(0.3*ch), 0, 1);
          tx = tx*(1-teB) + ca*teB; ty = ty*(1-teB) + sa*teB;
          const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
          // 方向を 一様(1,0)→接線 へ ブレンド（＝表面に沿う）
          let ddx=(1-follow)+follow*tx, ddy=follow*ty; const dl=Math.hypot(ddx,ddy)||1; ddx/=dl; ddy/=dl;
          // 速さ：上面は加速（＝色が赤くなる・循環のかわり）、下面は少し減速
          const spd = upper ? U*(1 + (this.cl()+0.20)*1.9*follow)
                            : U*(1 - 0.12*follow);
          vx=ddx*spd; vy=ddy*spd;
        }
        vy += this.downwash(pt);   // 前で上がり・後ろで下へ（翼が空気を下へ押す）
        // 剥離（失速）：上面の流れを 翼背から浮かせて まっすぐ後ろ〜やや上へ。死水で うねり（カルマン渦列風）
        if (sep > 0){
          const sgn = this.sucUp()? -1 : 1;              // 吸い込み面の「浮く」向き（上面＝上=-y）
          const depth = this.sucUp()? -wy : wy;
          vy += sgn * U * 0.12 * sep;                    // やや上向きに 浮く
          const near = clamp(1 - depth/(1.3*this.R), 0, 1);   // 翼背に近いほど（死水域）
          vy += sgn * U * 0.55 * sep * near * Math.sin(wx/(0.4*this.R)*Math.PI - TIME*2.4); // 交互の うねり
        }
        // なめらかな反発場（非貫通）：近いほど内向き成分を除去＝ゆるくカーブして先端で分かれる。
        // ただし剥離域では弱める＝翼背を回り込まず まっすぐ浮いて飛ぶ
        if (naF.dist < this.R*0.8){
          const wg=1 - clamp(naF.dist/(this.R*0.8), 0, 1), wsm=wg*wg*(3-2*wg)*(1-0.9*sep);
          const vn = vx*naF.nx + vy*naF.ny;
          if (vn < 0){ vx -= naF.nx*vn*wsm; vy -= naF.ny*vn*wsm; }
        }
        return { x:vx, y:vy };
      },
      // 上面後方の「死水域（剥離ウェイク）」だけ 0..1。ここだけ渦が効く（翼の腹より下は 0）
      wakeMask(pt){
        const deg=Math.abs(this.alpha*180/Math.PI); const on=clamp((deg-11)/6, 0, 1); if (on<=0) return 0;
        const dx=pt.x-this.center.x, dy=pt.y-this.center.y;
        const ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        const wx=dx*ca+dy*sa, wy=-dx*sa+dy*ca;                 // wy<0 上面側
        const depth=this.sucUp()? -wy : wy;                    // 吸い込み面の深さ（>0でその面）
        if (depth < -0.12*this.R) return 0;                    // 反対面は 渦なし（素直に流れる）
        const xi=(wx + 0.1*this.R)/(2.8*this.R);               // 前縁付近〜後方へ
        if (xi < 0) return 0;
        const reach=this.R*2.0; const yf=Math.exp(-(depth*depth)/(reach*reach));
        return on*yf*clamp(xi*1.4, 0, 1)*clamp(1.6-xi, 0, 1);
      },
      // つぶつぶ用：剥離ウェイクの中だけ 渦（うず）に巻かれる
      flowVel(pt){
        const v=this.field(pt); const m=this.wakeMask(pt);
        if (m<=0) return v;
        const vo=vortexVel(pt, this.shed);
        return { x:v.x+vo.x*m, y:v.y+vo.y*m };
      },
      // 上面後方から 渦を はきだす（迎え角が大きいほど 強く・多く）
      update(){
        const deg=Math.abs(this.alpha*180/Math.PI);
        const str=clamp((deg-11)/16, 0, 1);
        const up=this.sucUp();   // 吸い込み面（＝剥離面）が上面か下面か
        for (let i=this.shed.length-1;i>=0;i--){ const v=this.shed[i]; v.x+=this.UINF*0.6; v.y+=(up?-1:1)*this.UINF*0.05; v.G*=0.975; v.age++; if (v.x>W+40||Math.abs(v.G)<0.4) this.shed.splice(i,1); }
        this.spawnT--;
        if (str>0 && this.spawnT<=0){
          this.spawnT=Math.max(6, 16-deg*0.4);
          const ca=Math.cos(this.alpha), sa=Math.sin(this.alpha), ch=this.chord();
          const swy=(up?-1:1)*0.24*this.R;   // 吸い込み面側へ
          const S={ x:this.center.x + 0.10*ch*ca - swy*sa, y:this.center.y + 0.10*ch*sa + swy*ca }; // 剥離面やや後ろ
          this.shed.push({ x:S.x, y:S.y, G:(up?1:-1)*this.UINF*this.R*(0.5+0.9*str), core:(this.R*0.45)*(this.R*0.45), age:0, str });
          if (this.shed.length>18) this.shed.shift();
        }
      },
      drawSwirls(){
        for (const v of this.shed){
          const rad=clamp(Math.abs(v.G)/(this.UINF*this.R)*20, 6, 20), dir=v.G>=0?1:-1;
          const ph=TIME*6*dir + v.age*0.12, steps=22, turns=1.6;
          ctx.strokeStyle="rgba(180,215,255,"+clamp(v.str*0.9,0.18,0.9)+")"; ctx.lineWidth=2; ctx.lineCap="round";
          ctx.beginPath();
          for (let i=0;i<=steps;i++){ const t=i/steps, a=ph+t*turns*2*Math.PI*dir, r=rad*t; const x=v.x+Math.cos(a)*r, y=v.y+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
          ctx.stroke();
        }
      },
      // 翼面のすぐ外側に種点を置く（法線方向に翼から出て +skim だけ外へ）
      skimSeed(frac, sideUp, skim){
        const ch=this.chord(), ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        const base={ x:this.center.x+(frac-0.5)*ch*ca, y:this.center.y+(frac-0.5)*ch*sa }; // コード線上の点
        const n = sideUp ? {x:sa, y:-ca} : {x:-sa, y:ca};   // 翼面の外向き法線（上/下）
        let d=0; while (d<36 && this.pointInPoly({x:base.x+n.x*d, y:base.y+n.y*d})) d+=1; // 翼の外に出るまで
        const off=d+skim;
        return { x:base.x+n.x*off, y:base.y+n.y*off };
      },
      retrace() {   // 翼ポリゴンを作り直し、流線を引き直す
        this.buildPoly();
        this.lines = [];
        const ys = [];
        for (let i=0;i<9;i++) ys.push(H*(0.05 + 0.9*i/8));                  // 全体に うっすら
        const band = 2.0*this.R;
        for (let i=0;i<16;i++) ys.push(clamp(this.center.y - band + 2*band*i/15, 4, H-4)); // 翼の近くは 密に
        const nStep = Math.ceil(W/7) + 20;   // 画面の端まで届く長さ（翼まで線が途切れない）
        for (const y of ys){
          const pts = smoothPts(streamline(p=>this.field(p), {x:2, y}, 7, nStep), 1);
          this.lines.push({ pts, k:this.lines.length*0.7 });
        }
        // 前から来た風が前縁（よどみ点）に当たって上下に分かれる線を1本（前向きトレース＝安定）
        const nose = this.pivot || this.center;
        const sideAt = (y0)=>{   // nose.x での 流線の上下（<0=上を通る / >0=下を通る）
          const pts=streamline(p=>this.field(p), {x:2, y:y0}, 6, Math.ceil(nose.x/6)+40);
          for (let i=1;i<pts.length;i++){
            if ((pts[i-1].x-nose.x)*(pts[i].x-nose.x) <= 0){
              const t=(nose.x-pts[i-1].x)/((pts[i].x-pts[i-1].x)||1);
              return (pts[i-1].y + t*(pts[i].y-pts[i-1].y)) - nose.y;
            }
          }
          return pts[pts.length-1].y - nose.y;
        };
        let lo=this.center.y-1.4*this.R, hi=this.center.y+1.4*this.R, sLo=sideAt(lo), sHi=sideAt(hi);
        if (sLo*sHi < 0){ for (let it=0;it<16;it++){ const mid=(lo+hi)/2, sm=sideAt(mid); if (sm*sLo<=0){hi=mid;sHi=sm;} else {lo=mid;sLo=sm;} } }
        let sPts=streamline(p=>this.field(p), {x:2, y:(lo+hi)/2}, 6, Math.ceil(W/6));
        // 先端の0.45R手前で止めて、まっすぐ先端へ（手前での よどみの クネリ・重なりを防ぐ）
        let cut=sPts.length;
        for (let i=0;i<sPts.length;i++){ if (Math.hypot(sPts[i].x-nose.x, sPts[i].y-nose.y) < 0.45*this.R){ cut=i; break; } }
        sPts=sPts.slice(0, Math.max(2,cut));
        sPts.push({x:nose.x, y:nose.y, sp:0});                       // 先端（よどみ点）へ直線で
        this.lines.push({ pts: smoothPts(sPts,2), k:this.lines.length*0.7, stag:true }); // よどみ線（明るく描く）
        // 翼面にぴったり添う線（前縁のすぐ上／下から出して、翼面をなめるように流す＝前縁で分かれる）
        const nSkim = Math.ceil(W/4);
        for (const skim of [2, 9, 16]){
          this.lines.push({ pts: smoothPts(streamline(p=>this.field(p), this.skimSeed(0.0, true,  skim), 4, nSkim), 3), k:this.lines.length*0.7 });
          this.lines.push({ pts: smoothPts(streamline(p=>this.field(p), this.skimSeed(0.0, false, skim), 4, nSkim), 3), k:this.lines.length*0.7 });
        }
      },
      // 剥離時の「死水域」に うねる後流（毎フレーム引き直して アニメ）。カルマン渦列風
      retraceWake() {
        this.wakeLines = [];
        const deg=Math.abs(this.alpha*180/Math.PI); const amt=clamp((deg-11)/10,0,1);
        if (amt<=0.2) return;
        const up=this.sucUp(), sepFrac=clamp(0.72-0.40*amt, 0.30, 0.9);
        for (const sk of [5, 13, 22, 33]){
          const pts=smoothPts(streamline(p=>this.field(p), this.skimSeed(sepFrac+0.06, up, sk), 5, Math.ceil(W/5)), 1);
          this.wakeLines.push({ pts, k:this.wakeLines.length*0.7 });
        }
      },
      seedP(start) {
        let y;
        if (Math.random()<0.65) y=this.center.y + (Math.random()*2-1)*2.3*this.R; // 翼の近くに 多め
        else y=Math.random()*H;
        y=clamp(y,2,H-2);
        return { x: start? Math.random()*W : -4, y, trail:[], life:Math.random()*120, sp:0 };
      },
      stepParts() {
        if (!this.parts || this.parts.length===0){ this.parts=[]; for(let i=0;i<240;i++) this.parts.push(this.seedP(true)); }
        for (let i=0;i<this.parts.length;i++){
          const pt=this.parts[i];
          for (let k=0;k<2;k++){ const v=this.flowVel(pt); pt.x+=v.x*1.1; pt.y+=v.y*1.1; pt.sp=len(v); }
          const m=this.wakeMask(pt);                           // 死水域は 乱流（ランダムに クルクル）
          if (m>0){ const j=m*this.UINF*0.9; pt.x+=(Math.random()*2-1)*j; pt.y+=(Math.random()*2-1)*j; }
          const na=this.nearest(pt);
          if (na.inside){ pt.x += na.nx*(na.dist+2); pt.y += na.ny*(na.dist+2); }   // 翼から押し出す
          pt.life++;
          pt.trail.push({x:pt.x,y:pt.y}); if(pt.trail.length>6) pt.trail.shift();
          if (pt.x>W+4||pt.y<-30||pt.y>H+30||pt.life>500) this.parts[i]=this.seedP(false);
        }
      },
      // 剥離域 0..1。迎え角が大きいほど 分離点が前縁へ前進（前半から剥がれる）
      sepFactor(pt) {
        const deg=Math.abs(this.alpha*180/Math.PI);
        const amt=clamp((deg-11)/10, 0, 1); if (amt<=0) return 0;   // 11°→21° で 0→1
        const dx=pt.x-this.center.x, dy=pt.y-this.center.y;
        const ca=Math.cos(this.alpha), sa=Math.sin(this.alpha);
        const wx = dx*ca + dy*sa, wy = -dx*sa + dy*ca;    // wy<0 上面
        const depth=this.sucUp()? -wy : wy;               // 吸い込み面の深さ
        if (depth < 0.02*this.R) return 0;
        const ch=this.chord();
        const sepFrac = clamp(0.72 - 0.40*amt, 0.30, 0.9); // 分離点：後縁寄り→翼頂(前半)へ前進
        const xsep = (sepFrac - 0.5)*ch;
        const s = clamp((wx - xsep)/(0.18*ch), 0, 1);     // 分離点より後ろで 1
        const yf = clamp(1 - depth/(1.7*this.R), 0, 1);
        return amt * s * yf;
      },
      draw() {
        const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0c1426"); g.addColorStop(1,"#0f1a30");
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
        const smax=this.UINF*2.2;
        if (flowStyle==="stream"){
          for (const line of this.lines){
            const pts=line.pts; if (pts.length<2) continue;
            if (line.stag){   // よどみ線（前縁で分かれる）は明るく目立たせる
              ctx.strokeStyle="rgba(223,232,255,.92)"; ctx.lineWidth=2.4; ctx.lineCap="round";
              ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
              for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
              ctx.stroke();
            } else {
              drawSpeedPolyline(i=>pts[i], pts.length, smax, 1.9);
            }
          }
          if (this.wakeLines) for (const line of this.wakeLines){   // 死水域の うねる後流
            const pts=line.pts; if (pts.length<2) continue;
            drawSpeedPolyline(i=>pts[i], pts.length, smax, 1.9);
          }
        } else {
          drawTrails(this.parts, smax);
        }
        this.drawSwirls();   // 上面後方の 剥離うず（グルグル）
        // 翼型（キャンバー付き・迎え角ぶん回転）
        const c=this.center, ch=this.chord();
        ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(this.alpha);
        ctx.beginPath();
        for (let i=0;i<AIRFOIL.length;i++){ const X=AIRFOIL[i].x*ch, Y=-AIRFOIL[i].y*ch; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
        ctx.closePath(); ctx.fillStyle="#eef2fa"; ctx.fill();
        ctx.restore();
        // AoAハンドル（前ふち）
        const hp=this.aoaHandlePos();
        ctx.beginPath(); ctx.arc(hp.x,hp.y,10,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.14)"; ctx.fill(); ctx.strokeStyle="#ffd43b"; ctx.lineWidth=2.5; ctx.stroke();
        const deg=Math.abs(this.alpha*180/Math.PI);
        ctx.fillStyle="rgba(255,255,255,.75)"; ctx.font="bold 13px sans-serif"; ctx.textAlign="left";
        ctx.fillText("つばさの かくど: "+deg.toFixed(0)+"°", 12, 22);
        if (showForces){
          const Lp=clamp(this.gamma()*2.2, -130, 130);   // 負の揚力なら下向き
          if (Math.abs(Lp)>4) arrow(c, {x:c.x, y:c.y-Lp}, "#7dff9b", "ようりょく");
        }
        if (deg>13){
          ctx.fillStyle="#ff8a5c"; ctx.font="bold 15px sans-serif"; ctx.textAlign="center";
          ctx.fillText("うしろが はくり（しっそく ぎみ）", W/2, 42);
        }
      },
      aoaHandlePos(){ const p=this.pivot||this.center; return { x: p.x - this.R*0.9*Math.cos(this.alpha), y: p.y - this.R*0.9*Math.sin(this.alpha) }; }
    };

    // ---- 共通：矢印 ----
    function arrow(from, to, color, label) {
      const d=sub(to,from), l=len(d); if (l<2) return;
      const u=norm(d);
      ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=3; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); ctx.stroke();
      const n=perp(u);
      ctx.beginPath(); ctx.moveTo(to.x,to.y);
      ctx.lineTo(to.x-u.x*12+n.x*7, to.y-u.y*12+n.y*7);
      ctx.lineTo(to.x-u.x*12-n.x*7, to.y-u.y*12-n.y*7);
      ctx.closePath(); ctx.fill();
      if (label){ ctx.font="bold 12px sans-serif"; ctx.textAlign="center";
        ctx.fillText(label, to.x+u.x*2, to.y - (u.y<0? 10 : -16)); }
    }

    const MODES = {
      blower: { ref: BL, hint:"🎈 まわりの かぜが 物の 上で うずを まき、全方位の 圧力（赤=おす／青=すう）で 位置が きまる",
        tip:"物を ドラッグ。白い◯で むきを かえられる。「つぶつぶ」で 流れる粒／線 を きりかえ。「あつりょく」で 赤=おす・青=すう。" },
      wing:   { ref: WG, hint:"✈️ かぜは 水平に ながれる。つばさの 上は はやく、はがれないと きれいに ながれる",
        tip:"黄色い◯を 上下に ドラッグ。「つぶつぶ」で 流れる粒／線 を きりかえ。角度を あげすぎると うしろが はがれて 波打つ。" }
    };

    // ---- 描画ループ ----
    let running = true;
    function frame() {
      if (!running) return;
      TIME = performance.now()/1000;
      if (dragTarget) applyDrag();
      const sc = MODES[currentMode].ref;
      if (currentMode==="blower") {
        sc.update(dragTarget==="ball");
        if (flowStyle==="stream") sc.retrace(); else sc.stepParts();
      } else {
        sc.update();
        if (flowStyle==="dots") sc.stepParts(); else sc.retraceWake();
      }
      sc.draw();
      drawLegend();
      requestAnimationFrame(frame);
    }

    // ---- リサイズ ----
    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      W=rect.width; H=rect.height; DPR=Math.min(2, window.devicePixelRatio||1);
      canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);
      BL.make(); WG.make();
    }

    // ---- 入力 ----
    let dragTarget = null, lastPointer = null;
    function pointerPos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
    function near(p,q,rad){ return Math.hypot(p.x-q.x,p.y-q.y) < rad; }
    canvas.addEventListener("pointerdown",(e)=>{
      e.preventDefault(); const m=pointerPos(e); lastPointer=m;
      if (currentMode==="blower") {
        if (near(m, BL.ball, BL.BALLR+10)) dragTarget="ball";
        else if (near(m, BL.tiltHandlePos(), 22)) dragTarget="tilt";
      } else {
        if (near(m, WG.aoaHandlePos(), 24)) dragTarget="aoa";
      }
      if (dragTarget) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove",(e)=>{ if(!dragTarget) return; lastPointer=pointerPos(e); });
    function applyDrag(){
      const m=lastPointer; if(!m) return;
      if (dragTarget==="ball"){ BL.ball={x:clamp(m.x,BL.BALLR,W-BL.BALLR),y:clamp(m.y,BL.BALLR,H-BL.BALLR)}; BL.vel={x:0,y:0}; }
      else if (dragTarget==="tilt"){ const d=sub(m,BL.fan); BL.jetAng=clamp(Math.atan2(d.x,-d.y), -0.6, 0.6); }
      else if (dragTarget==="aoa"){ const p=WG.pivot||WG.center; WG.alpha = clamp(Math.atan2(p.y - m.y, p.x - m.x), -0.52, 0.52); WG.retrace(); }
    }
    function endDrag(e){ dragTarget=null; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} }
    canvas.addEventListener("pointerup",endDrag);
    canvas.addEventListener("pointercancel",endDrag);

    // ---- モード切替 ----
    function applyMode() {
      const sc = MODES[currentMode];
      hintEl.textContent = sc.hint; tipEl.textContent = sc.tip;
      pressureBtn.style.display = currentMode==="blower" ? "" : "none";   // 圧力は ふうせん だけ
      document.querySelectorAll(".mode-tab").forEach(t=>t.classList.toggle("active", t.dataset.mode===currentMode));
    }
    document.querySelectorAll(".mode-tab").forEach(tab=>{
      tab.addEventListener("click",()=>{ if(currentMode===tab.dataset.mode) return; currentMode=tab.dataset.mode; applyMode(); });
    });
    forceBtn.addEventListener("click",()=>{ showForces=!showForces; forceBtn.classList.toggle("on",showForces); });
    pressureBtn.addEventListener("click",()=>{ showPressure=!showPressure; pressureBtn.classList.toggle("on",showPressure); });
    flowBtn.addEventListener("click",()=>{ flowStyle = flowStyle==="stream" ? "dots" : "stream"; flowBtn.classList.toggle("on", flowStyle==="dots"); });
    document.getElementById("resetBtn").addEventListener("click",()=>{ MODES[currentMode].ref.make(); });

    document.addEventListener("visibilitychange",()=>{ running=!document.hidden; if(running) frame(); });
    window.addEventListener("resize", fitCanvas);
    window.addEventListener("load",()=>{ fitCanvas(); applyMode(); });

    fitCanvas(); applyMode(); frame();
  })();

  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/service-worker.js").catch(()=>{}); }
  </script>
</body>
</html>
